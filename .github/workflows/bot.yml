name: Restock Auto Bot

on:
  schedule:
    - cron: '*/10 * * * *' # 매 10분마다 알아서 실행
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 파이썬 코드 실행
        run: python bot.py
        
      - name: 봇의 기억(파일) 저장하기
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "GitHub Bot"
          git add memory.txt
          git commit -m "update memory" || exit 0
          git push
